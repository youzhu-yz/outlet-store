name: 确认订购
on:
  workflow_dispatch:
    inputs:
      pid:
        description: '商品编号'
        required: true
        type: string
      name:
        description: '买家花名'
        required: true
        type: string

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查是否已被订购(先到先得)
        run: |
          python3 - <<'PY'
          import json, sys
          pid = "${{ inputs.pid }}".strip()
          with open('overlay.json', 'r', encoding='utf-8') as f:
              ov = json.load(f)
          if pid in ov:
              holder = ov[pid]
              holder_name = holder.get("name", "") if isinstance(holder, dict) else ""
              print("!! 商品 #%s 已被「%s」锁定,本次确认被拒绝" % (pid, holder_name or "他人"))
              sys.exit(1)
          print("商品 #%s 未被锁定,继续确认" % pid)
          PY

      - name: 写入锁定状态与花名
        run: |
          python3 - <<'PY'
          import json
          pid = "${{ inputs.pid }}".strip()
          name = "${{ inputs.name }}".strip()
          with open('overlay.json', 'r', encoding='utf-8') as f:
              ov = json.load(f)
          ov[pid] = {"status": "已预订", "name": name}
          with open('overlay.json', 'w', encoding='utf-8') as f:
              json.dump(ov, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('overlay:', ov)
          PY

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlay.json
          git commit -m "锁定商品 #${{ inputs.pid }} 花名:${{ inputs.name }}"
          git push
