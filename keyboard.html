<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#20242e; --muted:#7b8394; --line:#e6e9f0;
  --accent:#3d5af1; --accent-weak:#eef1ff; --price:#e0472f; --green:#1a9e5c;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 10px rgba(16,24,40,.05), 0 12px 28px rgba(16,24,40,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.6;
}
.hidden{display:none!important}
button{font-family:inherit}

/* ---------- 头部 ---------- */
.hero{
  background:linear-gradient(135deg,#141a2e 0%,#1d2a4d 55%,#24386b 100%);
  background-image:
    radial-gradient(ellipse 600px 300px at 85% -40%, rgba(90,130,255,.22), transparent),
    radial-gradient(ellipse 400px 240px at 8% 130%, rgba(60,200,190,.10), transparent),
    linear-gradient(135deg,#141a2e 0%,#1d2a4d 55%,#24386b 100%);
  color:#fff; padding:20px 20px;
}
.hero-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-text{flex:1;min-width:260px;display:flex;align-items:center;gap:12px}
.hero h1{font-size:26px;font-weight:800;letter-spacing:.5px}
.hero .sub{margin-top:6px;font-size:13px;color:#aab6d4}
.ctl{
  border:1px solid var(--line);border-radius:9px;background:#fbfcfe;
  padding:7px 9px;font-size:13px;color:var(--ink);outline:none;cursor:pointer;flex:none;
  max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dir-btn{overflow:visible;line-height:1;border-radius:0 8px 8px 0}
.sort-group .ctl{background:transparent}
.w-no{color:#9aa2b1}
/* 多选筛选下拉 */
.mselect{position:relative;flex:none}
.ms-btn{display:inline-flex;align-items:center}
.ms-btn::after{content:"▾";font-size:10px;color:var(--muted);margin-left:5px}
/* 排序 + 升降序 融合控件 */
.sort-group{
  display:flex;align-items:stretch;flex:none;
  border:1px solid var(--line);border-radius:9px;background:#fbfcfe;
  transition:border-color .15s, box-shadow .15s;
}
.sort-group:hover{border-color:#c9d1e2}
.sort-group:focus-within,.sort-group.open{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,90,241,.12);
}
.sort-group button{outline:none}
.sort-group .mselect .ms-btn{border:none;border-radius:0;height:100%;background:transparent}
.dir-btn{
  border:none;border-left:1px solid var(--line);background:transparent;
  padding:0 9px;font-size:12px;cursor:pointer;color:var(--ink);
}
.dir-btn:hover{background:#eef1f8;color:var(--accent)}
.ms-panel{
  position:absolute;top:calc(100% + 6px);left:0;z-index:200;background:#fff;
  border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.16);
  padding:6px;min-width:150px;max-height:300px;overflow-y:auto;
}
.ms-actions{
  display:flex;gap:8px;justify-content:flex-end;
  border-bottom:1px solid var(--line);padding:2px 6px 6px;margin-bottom:4px;
}
.ms-all{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 4px}
.ms-all:hover{text-decoration:underline}
.ms-panel label{
  display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;
  font-size:13px;cursor:pointer;white-space:nowrap;
}
.ms-panel label:hover{background:#f2f4fa}
/* 单选面板选项(排序 / 无线) */
.ms-opt{
  display:block;width:100%;text-align:left;padding:8px 10px;
  border:none;background:none;font-size:13px;cursor:pointer;
  border-radius:7px;color:var(--ink);white-space:nowrap;
}
.ms-opt:hover{background:#f2f4fa}
.ms-opt.on{color:var(--accent);background:var(--accent-weak);font-weight:600}
.ms-panel label:hover{background:#f2f4fa}
/* 表头排序 */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover,th.sortable.active{color:var(--accent)}
th .arr{font-size:10px;margin-left:3px}
.refresh-btn{
  background:#fff;color:#1d2740;border:none;border-radius:999px;
  padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.28);transition:transform .15s,box-shadow .15s;
  flex:none;
}
.refresh-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.32)}

/* ---------- 工具栏 ---------- */
.toolbar{position:sticky;top:12px;z-index:40;padding:0 16px;margin-top:16px}
.toolbar-inner{
  max-width:1200px;margin:0 auto;position:relative;
  border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);
  display:flex;gap:12px;align-items:center;padding:8px 10px;flex-wrap:wrap;
  background:rgba(255,255,255,.92);
}
.toolbar-inner::before{
  content:"";position:absolute;inset:0;z-index:-1;
  border-radius:inherit;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.tb-filters{display:contents}
.tb-menu{
  border:1px solid var(--line);background:#fbfcfe;border-radius:9px;
  width:32px;height:32px;flex:none;order:-1;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink);cursor:pointer;
}
.tb-menu:hover{border-color:#c9d1e2;background:#fff}
#navBtn2{overflow:hidden;
  transition:width .3s cubic-bezier(.2,.9,.3,1),margin .3s cubic-bezier(.2,.9,.3,1),opacity .26s}
#navBtn2.closed{width:0;opacity:0;margin-right:-12px;pointer-events:none}
#navBtn2:not(.closed){animation:menuDrop .32s cubic-bezier(.2,.9,.3,1)}
.tb-pay{width:32px;flex:none;overflow:hidden;
  transition:width .3s cubic-bezier(.2,.9,.3,1),margin .3s cubic-bezier(.2,.9,.3,1),opacity .26s}
.tb-pay.closed{width:0;opacity:0;margin-left:-12px;pointer-events:none}
.tb-pay:not(.closed) .tb-menu{animation:menuDropR .32s cubic-bezier(.2,.9,.3,1)}
@keyframes menuDropR{
  from{opacity:0;transform:translate(46px,-72px)}
  to{opacity:1;transform:none}
}
#navBtn2:not(.closed){animation:menuDrop .32s cubic-bezier(.2,.9,.3,1)}
@keyframes menuDrop{
  from{opacity:0;transform:translate(-46px,-72px)}
  to{opacity:1;transform:none}
}
.seg{display:flex;background:#f1f3f8;border-radius:9px;padding:3px;flex:none;margin-right:auto}
.seg button{
  border:none;background:transparent;padding:6px 16px;border-radius:7px;
  font-size:13px;cursor:pointer;color:#5b6373;
}
.seg button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* 搜索:扁平图标按钮,点击向左展开输入框 */
.search-wrap{display:flex;align-items:center;flex:none;position:relative}
#search{
  flex:1 1 0;width:0;min-width:0;opacity:0;padding:0;height:34px;
  border:1px solid transparent;border-radius:999px;background:transparent;
  outline:none;font-size:13px;
  transition:width .25s ease,opacity .2s ease,padding .25s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.search-wrap.open{flex:0 0 auto;width:min(320px,40vw)}
.search-wrap.open #search{
  opacity:1;padding:8px 8px 8px 14px;
  border-color:var(--line);background:#fbfcfe;
}
#search:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(61,90,241,.12)}
.s-btn{
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  width:34px;height:34px;border-radius:50%;flex:none;margin-left:6px;
  display:flex;align-items:center;justify-content:center;
  transition:color .15s,background .15s;
}
.s-btn:hover{color:var(--accent);background:rgba(0,0,0,.04)}
.search-wrap.open .s-btn{color:var(--accent);background:var(--accent-weak)}
.s-ico{
  display:none;position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;
}
.model .g{color:#98a1b3;font-size:13px;font-weight:600}
.c-model .g{color:#6b7280;font-size:12.5px}
.c-fac{color:var(--ink);font-size:12.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-memo{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#666e7e}
.memo{font-size:12px;color:#8494f4;margin:-4px 0 10px}
.lb-cap-sub{color:#aab3c5;font-size:12px;text-align:center;margin-top:-6px}
.acc{color:var(--accent)}
.memo-td{max-width:260px;white-space:normal}

/* ---------- 卡片 ---------- */
main{max-width:1200px;margin:0 auto;padding:0 16px}
.cards{
  margin-top:20px;display:grid;gap:18px;
  grid-template-columns:repeat(4,1fr);
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
  transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(16,24,40,.05), 0 10px 22px rgba(16,24,40,.09), 0 20px 44px rgba(16,24,40,.16)}
/* 已出售:灰色蒙版 + 闲鱼风「卖掉了」印章图 */
.card.sold{position:relative}
/* 已出售:仅一层蒙版 + 印章,图片文字保持原样 */
.card.sold{position:relative}
.card.sold::before{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.52) 0%,rgba(214,220,230,.34) 52%,rgba(198,205,217,.40) 100%);
}
*{-webkit-tap-highlight-color:transparent}
button,button *{-webkit-user-select:none;user-select:none}
button:focus,button:focus-visible{outline:none}
/* 印章:盖在缩略图区正中,不透明度 70% */
.card.sold .card-img::after{
  content:"";position:absolute;left:50%;top:50%;
  width:min(48%,156px);aspect-ratio:459/303;
  transform:translate(-50%,-50%) rotate(-8deg);
  background:url("assets/已出售_闲鱼.png") center/contain no-repeat;
  filter:drop-shadow(0 3px 12px rgba(20,26,46,.30));
  opacity:.8;
  z-index:5;pointer-events:none;
}
/* 图片懒加载:底色占位,加载完成后渐显 */
.card-img img.main{opacity:0;transition:opacity .25s ease}
.card-img img.main.ld{opacity:1}
.c-img img{opacity:0;transition:opacity .25s ease}
.c-img img.ld{opacity:1}
tr.sold-tr td{color:#b3bac7!important}
tr.sold-tr .price-cell{color:#b3bac7!important}
tr.sold-tr .price-cell.orig-p{color:#c4cad6!important;text-decoration:line-through}
tr.sold-tr .off{filter:grayscale(1);opacity:.45}
tr.sold-tr .w-yes{color:#b3bac7!important}
tr.sold-tr{background:#f8f9fc}
tr.sold-tr:hover{background:#f2f4f9}
.card-img{
  position:relative;aspect-ratio:4/3;overflow:hidden;flex:none;
  background-color:#f6f7fb;
  background-image:radial-gradient(circle, rgba(120,130,150,.10) 1px, transparent 1px);
  background-size:14px 14px;
}
/* 骨架屏:图片加载完成前微光扫过,加载完成后被图片覆盖 */
.card-img::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.6) 50%,transparent 68%);
  background-size:200% 100%;
  animation:skelSweep 1.5s ease-in-out infinite;
}
@keyframes skelSweep{
  from{background-position:120% 0}
  to{background-position:-120% 0}
}
.card-img img.main{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .35s;cursor:zoom-in;display:block;
}
/* 占位图整图显示,不被裁切 */
.card-img img.noimg-main{object-fit:contain;background:#eef1f5;cursor:default}
.card-img:hover img.noimg-main{transform:none}
.card-img:hover img.main{transform:scale(1.045)}
.card-img.no-img{cursor:pointer}
.card-img.no-img:hover .ph{border-color:var(--accent)}
.card-img.no-img:hover .ph-t{color:var(--accent)}
.badge,.count{
  position:absolute;top:10px;z-index:2;
  background:rgba(15,18,28,.85);color:#fff;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:999px;
}
.badge{left:10px}
.count{right:10px}
.ph{
  position:absolute;inset:13px;border:1.5px dashed #c6cdda;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.ph-ico{font-size:26px;opacity:.45}
.ph-t{font-size:12px;color:var(--muted)}
.ph-f{
  font-size:11px;color:#8d97ab;background:#f5f7fa;border:1px solid #e4e8f0;
  padding:2px 9px;border-radius:6px;font-family:Consolas,monospace;
}
.card-strip{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;flex:none}
.card-strip:empty{display:none}
.card-strip img{
  width:50px;height:38px;object-fit:cover;border-radius:6px;cursor:zoom-in;
  border:1px solid var(--line);flex:none;
}
.card-strip img:hover{border-color:var(--accent)}
.card-strip img.on{border-color:var(--line)}
.card-strip img:not(.on){opacity:.55;filter:grayscale(.3)}
.card-strip img:not(.on):hover{opacity:.85}
.card-body{padding:13px 16px 16px;display:flex;flex-direction:column;flex:1}
.brand{font-size:12px;letter-spacing:1.5px;color:var(--muted);font-weight:600;text-transform:uppercase}
.model{font-size:17px;font-weight:700;line-height:1.35}
.model-row{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
/* 紧凑卡片(鼠标页) */
.card-body.cb{flex-direction:row;justify-content:space-between;gap:10px;
  padding:8px 12px 10px;align-items:stretch}
.card-body.cb{position:relative}
.card-body.cb > .st-tag{position:absolute;left:10px;bottom:calc(100% + 6px);z-index:3}
.cb-main{min-width:0;flex:0 1 auto;align-self:flex-end}
.card-body.cb .p-main{white-space:nowrap}
.card-body.cb .orig{white-space:nowrap}
.card-body.cb .orig .off{display:inline-block;font-size:10px;padding:1px 6px;vertical-align:1px;margin-left:7px}
.card-body.cb .memo{font-size:11px;margin-top:2px}
.cb-side{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;
  gap:5px;min-width:0;max-width:58%}
.cb-name{display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  min-width:0;text-align:right}
.cb-brow{display:flex;align-items:center;gap:4px;min-width:0}
.cb-name .brand{font-size:11px;letter-spacing:1px;color:var(--muted);
  font-weight:600;text-transform:uppercase;white-space:nowrap}
.cb-name .model{font-weight:700;font-size:14px;line-height:1.3;
  white-space:nowrap;max-width:100%;overflow:hidden}
.cb-name .g{font-size:11px}
.cb-side .card-strip{padding:0;justify-content:flex-end}
.cb-side .card-strip img{width:44px;height:33px}
.model-row .model{flex:1;min-width:0}
.copy-btn{
  border:none;background:none;color:#b7bfcf;cursor:pointer;
  padding:3px;border-radius:6px;line-height:0;flex:none;
}
.copy-btn:hover{color:var(--accent);background:var(--accent-weak)}
.c-model{width:1%;max-width:var(--model-w,185px)}
.c-model .mw{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-width:0}
.c-model .mw .mt{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap}
.c-model .mw .g{flex:0 1 auto;min-width:0;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.c-model .mw .copy-btn{margin-left:auto;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:12px;padding:3px 10px;border-radius:999px;background:#f2f4f8;color:#4a5265;
}
.chip.yes{background:#e7f7ee;color:#177a48;font-weight:600}
.card-foot{display:flex;align-items:flex-end;gap:8px;margin-top:auto;padding-top:14px}
.p-main{display:flex;align-items:flex-end;gap:7px}
.cur{color:var(--price);font-size:32px;font-weight:800;line-height:1}
.cur .num{display:inline-block;transform:scaleY(1.1);transform-origin:bottom;font-style:normal}
.cur .yen{font-size:14px;font-weight:700;margin-right:1px}
.orig{font-size:12px;color:#a3aab8;margin-top:1px;text-decoration:line-through}
.off{
  font-size:10px;font-weight:700;color:#d64a33;background:#fdeceb;
  border-radius:6px;padding:1px 6px;line-height:1.4;
}
.meta{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- 表格 ---------- */
.table-wrap{
  margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow-x:auto;
}
table{width:100%;border-collapse:collapse;min-width:1080px}
th{
  font-size:12px;color:var(--muted);font-weight:600;text-align:left;
  padding:11px 12px;background:#f8f9fc;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid #f0f2f6;white-space:nowrap}
tbody tr:nth-child(even){background:#fafbfd}
tbody tr:hover{background:#f2f5ff}
tbody tr:last-child td{border-bottom:none}
.c-id{color:var(--muted);font-family:Consolas,monospace}
.c-brand{font-weight:600;white-space:nowrap}
.c-brand .bt{overflow:hidden;white-space:nowrap}
.c-model{font-weight:600}
.c-img{background:#edeff4}
.c-img{white-space:nowrap}
.c-img img{
  width:48px;height:36px;object-fit:cover;border-radius:5px;cursor:zoom-in;
  border:1px solid var(--line);display:inline-block;vertical-align:middle;
}
.ti-row{display:inline-flex;gap:4px;vertical-align:middle}
th.c-img{white-space:nowrap;width:1%}
.c-img{width:1%;max-width:120px}
.noimg{color:#c3c9d6}
.c-st{white-space:nowrap}
.st-tag{display:inline-block;font-size:11px;font-weight:600;color:#1d4ed8;
  background:#e8efff;border:1px solid #c9d8fb;border-radius:999px;padding:2px 9px;
  white-space:nowrap}
/* 状态分色:进行中(蓝) / 已预订(黄) / 缺货(橙红) / 完成(灰) */
.st-tag.t-res{color:#8a6d1a;background:#fdf3d7;border-color:#ecd9a0}
.st-tag.t-out{color:#c2410c;background:#fdeee9;border-color:#f6d0c2}
.st-tag.t-done{color:#8a919e;background:#eef0f4;border-color:#d9dee7}
.price-cell{color:var(--price);font-weight:700}
.price-cell.orig-p{color:#a3aab8;font-weight:400;text-decoration:line-through}
.w-yes{color:var(--green);font-weight:600}

.empty{
  text-align:center;color:var(--muted);padding:70px 0;font-size:14px;
}

/* ---------- 页脚:贴整个页面最底部(内容不足一屏时贴屏幕底,超出时在文档末尾) ---------- */
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1 0 auto;width:100%}
footer{margin-top:auto;padding:16px 0 calc(18px + env(safe-area-inset-bottom,0px))}
.copy{text-align:center;font-size:12px;color:#a3aab8;margin:0}

/* ---------- 回到顶部:右下角贴边,滚动停止2s收纳只露一小截,滑动时滑出 ---------- */
.top-btn{
  position:fixed;right:0;bottom:96px;z-index:40;
  width:46px;height:46px;border:none;cursor:pointer;
  background:#fff;color:#61666d;
  border-radius:12px 0 0 12px;
  box-shadow:0 2px 10px rgba(16,24,40,.16), 0 0 0 1px rgba(16,24,40,.05);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:translateX(46px);
  transition:opacity .25s ease, transform .3s cubic-bezier(.2,.9,.3,1), visibility .25s;
}
.top-btn.show{opacity:1;visibility:visible;transform:translateX(0)}
.top-btn.show.tucked{transform:translateX(34px)}
.top-btn:hover{color:var(--accent);background:#f3f6ff}
.top-btn:active{filter:brightness(.92)}

/* ---------- 灯箱(大图) ---------- */
.lb{
  position:fixed;inset:0;z-index:100;background:rgba(8,10,16,.93);
  display:flex;align-items:center;justify-content:center;
}
/* dvh:跟随手机地址栏呼出/收起动态伸缩,标题行与缩放栏不会被挤出屏幕 */
.lb figure{position:relative;width:100vw;height:100vh;height:100dvh;margin:0;
  display:flex;align-items:center;justify-content:center}
.lb-stage{
  width:100vw;height:100vh;height:100dvh;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#0a0c11;cursor:zoom-in;touch-action:none;
}
.lb-stage.zoomed{cursor:grab}
.lb-stage.dragging{cursor:grabbing}
.lb-stage.zoomed{cursor:grab}
.lb-stage.dragging{cursor:grabbing}
.lb-stage img{
  max-width:100%;max-height:100%;object-fit:contain;
  user-select:none;-webkit-user-drag:none;
}
.lb-loading{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:#8b93a7;font-size:14px;letter-spacing:2px;
  text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none;z-index:2;
}
.lb figcaption{
  position:absolute;left:0;right:0;top:60px;text-align:center;
  color:#e8ebf2;font-size:19.5px;font-weight:700;letter-spacing:.5px;
  text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none;
}
.lb-cap-sub{
  position:absolute;left:0;right:0;top:90px;text-align:center;
  color:#aab3c5;font-size:13.2px;text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none;
}
.lb-zoom{
  position:absolute;bottom:62px;left:50%;transform:translateX(-50%);
  display:flex;flex-wrap:nowrap;align-items:center;gap:2px;
  background:rgba(20,24,34,.55);border-radius:999px;padding:4px;
  backdrop-filter:blur(6px);
}
.lb-zoom button{
  border:none;cursor:pointer;background:transparent;color:#fff;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
}
.lb-zoom button:hover{background:rgba(255,255,255,.18)}
.lb-zoom .val{
  min-width:50px;text-align:center;color:#fff;font-weight:600;
  font-size:12.5px;font-variant-numeric:tab-nums;
}
.lb-zoom .sep{width:1px;height:16px;background:rgba(255,255,255,.25);margin:0 6px}
.lb-zoom button.txt{width:auto;padding:0 10px;font-size:12.5px;color:#cfd4e0;
  white-space:nowrap;flex:none}
.lb-zoom button.txt:hover{color:#fff;background:transparent}
.lb-x{
  position:absolute;top:16px;right:22px;z-index:5;background:none;border:none;
  color:#fff;font-size:30px;line-height:1;cursor:pointer;opacity:.75;
}
.lb-x:hover{opacity:1}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.12);color:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.lb-nav:hover{background:rgba(255,255,255,.28)}
.lb-nav.prev{left:18px}
.lb-nav.next{right:18px}

/* ---------- 弹窗(刷新) ---------- */
.overlay{
  position:fixed;inset:0;z-index:90;background:rgba(15,18,28,.5);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.sheet{
  background:#fff;border-radius:16px;width:460px;max-width:100%;max-height:88vh;
  overflow-y:auto;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet-head h3{font-size:17px}
.sheet-head .x{
  border:none;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;
}
.sheet-tip{font-size:12px;color:var(--muted);margin-bottom:8px}
.act{
  width:100%;display:flex;gap:12px;align-items:center;text-align:left;
  padding:12px 13px;border:1px solid var(--line);border-radius:12px;
  background:#fff;cursor:pointer;margin-top:10px;transition:all .12s;
}
.act:hover{border-color:var(--accent);background:var(--accent-weak)}
.act .ico{
  font-size:19px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  background:#f2f4fa;border-radius:10px;flex:none;
}
.act tt{font-size:14px;font-weight:700;display:block;color:var(--ink)}
.act i{font-style:normal;font-size:12px;color:var(--muted);display:block;margin-top:1px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:120;
  background:#23283a;color:#fff;font-size:13px;padding:10px 20px;border-radius:999px;
  box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:86vw;text-align:center;
}
/* ---------- 提示弹窗 ---------- */
.alert-box{
  background:#fff;border-radius:14px;width:420px;max-width:92vw;
  padding:24px 22px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.alert-ico{font-size:34px;line-height:1}
.alert-msg{margin:12px 0 18px;font-size:13.5px;color:var(--ink);line-height:1.8;word-break:break-all;text-align:center;white-space:pre-line}
.alert-ok{
  background:var(--accent);color:#fff;border:none;border-radius:999px;
  padding:8px 36px;font-size:14px;font-weight:600;cursor:pointer;
}
.alert-ok:hover{filter:brightness(1.08)}
/* ---------- 付款码浮层(贴按钮弹出) ---------- */
.pay-anchor{position:relative;flex:none;z-index:45}
.pay-pop{
  position:absolute;top:calc(100% + 12px);right:0;z-index:60;
  background:#fff;border-radius:14px;padding:14px;
  box-shadow:0 16px 48px rgba(0,0,0,.35);
  width:max-content;max-width:92vw;
  transform-origin:top right;
  animation:popIn .26s cubic-bezier(.2,.9,.3,1);
}
.pay-pop.closing{animation:popOut .18s ease forwards}
@keyframes popIn{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:none}
}
@keyframes popOut{
  from{opacity:1;transform:none}
  to{opacity:0;transform:translateY(-8px)}
}
.pay-tabs{display:flex;gap:8px;margin-bottom:12px;justify-content:center}
.pay-tab{
  border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:6px 18px;font-size:14px;cursor:pointer;color:var(--muted);
}
.pay-tab.active{
  border-color:var(--accent);background:var(--accent-weak);
  color:var(--accent);font-weight:600;
}
.pay-item{margin:0}
.pay-wrap{display:flex;justify-content:center;overflow:auto;max-width:100%;max-height:calc(92vh - 190px)}
.pay-img{display:block;width:222px;height:300px;max-width:100%;object-fit:contain}
.pay-x{
  position:absolute;top:8px;right:10px;border:none;background:none;
  color:var(--muted);font-size:24px;line-height:1;cursor:pointer;z-index:2;
  display:none;
}
.pay-pop:hover .pay-x{color:var(--ink)}
.pay-note{margin-top:12px;font-size:15px;font-weight:700;color:#e02020;text-align:center;white-space:nowrap;overflow:hidden}

.toolbar{transition:transform .28s ease}
.toolbar.tb-hidden{transform:translateY(-115%)}
@media (max-width:640px){
  .hero{padding:16px 14px}
  .hero h1{font-size:17px;line-height:1.3}
  .hero-text{min-width:0}
  .hero-inner{align-items:center}
  .refresh-btn{padding:7px 14px;font-size:13px}
  .toolbar{top:6px;padding:0 10px;margin-top:10px}
}
/* ---------- 手机端竖屏 ---------- */
@media (max-width:1024px){ .cards{grid-template-columns:repeat(3,1fr)} }
@media (max-width:680px){
  .cards{grid-template-columns:repeat(2,1fr);gap:12px}
  .hero{padding:16px 14px}
  .hero-inner{gap:10px}
  .refresh-btn{padding:8px 16px;font-size:13px}
  .toolbar{top:6px;padding:0 10px;margin-top:10px}
  .toolbar-inner{gap:6px;padding:6px}
  #navBtn2.closed{margin-right:-6px}
  .ctl{padding:4px 6px;font-size:12px}
  .ms-btn::after{margin-left:3px}
  #viewSeg{flex:1 1 auto;min-width:0;margin-right:0;order:0}
  #viewSeg button{flex:1;text-align:center;padding:6px 0}
  .tb-filters{display:contents}
  .toolbar{transition:transform .28s ease}
  .toolbar.tb-hidden{transform:translateY(-115%)}
  .tb-break{display:none}
  .search-wrap{flex:1 1 auto;min-width:0;cursor:default;height:24px;position:relative}
  .sort-group{flex:1 1 calc((100% - 12px)/3);min-width:0;height:24px}
  .s-ico{display:flex;left:8px}
  .s-btn{display:none}
  #search{height:24px;width:100%;min-width:0;opacity:1;padding:0 8px 0 36px;border-color:var(--line);background:#fbfcfe;font-size:12px}
  .sort-group .ms-btn{height:100%;width:100%;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
  .sort-group .dir-btn{height:100%;width:28px;padding:0}
  .tb-filters > .mselect{flex:1 1 calc((100% - 12px)/3);min-width:0;order:5;height:24px}
  .tb-pay{order:1;margin-left:0}
  .tb-pay.closed{margin-left:-6px}
  #searchWrap{order:2;flex:1 1 100%;min-width:100%}
  .sort-group{order:3}
  .seg{order:0;flex:1 1 auto;min-width:0;margin-right:0}
  .seg button{flex:1 1 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;padding:4px 2px}
  .mselect .ms-btn{height:100%;width:100%;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
  .ms-panel{left:0;min-width:150px;width:max-content;max-width:calc(100vw - 16px)}
  .ctl{max-width:none}
  .copy-btn{padding:6px}
  /* 付款码:手机端为底部抽屉 */
  .pay-pop{
    position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;
    border-radius:16px 16px 0 0;transform-origin:bottom center;
    animation:popUp .26s cubic-bezier(.2,.9,.3,1);
  }
  .pay-pop.closing{animation:popOutUp .18s ease forwards}
  .pay-x{display:block}
  .pay-wrap{max-width:none;max-height:52vh;display:flex;justify-content:center}
  .lb-nav{width:38px;height:38px}
  .lb-zoom{gap:1px;padding:3px;flex-wrap:nowrap;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .lb-zoom button{width:28px;height:28px;font-size:14px}
  .lb-zoom .val{min-width:38px;font-size:11px}
  .lb-zoom button.txt{padding:0 7px;font-size:11.5px}
  .lb-nav.prev{left:8px}
  .lb-nav.next{right:8px}
  /* 手机端:标题单行贴顶,副行跟随,超长省略 */
  .lb figcaption{top:40px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 14px}
  .lb-cap-sub{top:66px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 14px}
}
@keyframes popUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes popOutUp{from{opacity:1}to{opacity:0;transform:translateY(24px)}}
@media (max-width:420px){ .cards{grid-template-columns:1fr} }
/* ---------- 品类菜单:汉堡按钮 + 左侧抽屉 ---------- */

.nav-link svg{opacity:.45}

    var c = (type==='n') ? (x - y) : String(x).localeCompare(String(y), 'zh-Hans-CN');
    return sortDir==='desc' ? -c : c;
  };
}

/* 紧凑卡片价格:与标准渲染同字号,仅折扣位置在购入价后 */
function priceHtmlC(item){
  var p = str(item['闲置价格']).trim();
  var out = '';
  var buys = [];
  ['购入价','壳体购入价','键帽购入价'].forEach(function(k){
    var v = str(item[k]).trim();
    if(v!=='' && isFinite(Number(v))) buys.push(esc(money(v)));
  });
  var offv = calcOffPct(item);
  var offTag = offv !== null ? ' <span class="off">-'+offv+'%</span>' : '';
  if(p!=='' && isFinite(Number(p))){
    out += '<div class="p-main"><span class="cur"><span class="yen">¥</span><i class="num">'+esc(money(p))+'</i></span></div>';

    out += '<div class="p-main"><span class="cur">'+esc(p)+'</span></div>';
  }else{
    out = '<div class="p-main"><span class="cur">面议</span></div>';

    out += '<div class="orig">购入价:'+buys.join('+')+offTag+'</div>';

  return out;

function calcTotalCost(item){
  var total = 0;
  ['购入价','壳体购入价','键帽购入价'].forEach(function(k){
    var n = Number(str(item[k]).trim());
    if(isFinite(n) && n > 0) total += n;
  });
  return total;
}
function calcOffPct(item){
  var p = Number(str(item['闲置价格']).trim());
  var total = calcTotalCost(item);
  if(!total || !isFinite(p) || p <= 0 || p >= total) return null;
  return Math.round((1 - p/total) * 100);
}

/* ---------- 搜索过滤 ---------- */
function applyFilter(){
  var q = query.trim().toLowerCase();
  var visible = 0;
  DATA.forEach(function(item){
    if(!item._search){
      item._search = FIELDS.concat(['编号']).map(function(k){ return str(item[k]); }).join(' ').toLowerCase();
    }
    var hit = !q || item._search.indexOf(q)>=0;
    if(hit && fBrand.size && !fBrand.has(str(item['品牌']).trim())) hit = false;
    if(hit && fKeys.size && !fKeys.has(str(item['键位']).trim())) hit = false;
    if(hit && fWire && normWireless(item['无线']) !== fWire) hit = false;
    if(hit && fSale !== ''){
      if(FILTER_CFG.saleFrom === 'status'){
        var sval = str(item['状态']).trim();
        if(fSale === '__none__' ? sval !== '' : sval !== fSale) hit = false;
      }else if((item['已出售'] ? '1' : '0') !== fSale){
        hit = false;
      }
    }
    var card = document.querySelector('.card[data-id="'+item['编号']+'"]');
    if(card) card.classList.toggle('hidden', !hit);
    var row = document.querySelector('#tbBody tr[data-id="'+item['编号']+'"]');
    if(row) row.style.display = hit ? '' : 'none';
    if(hit) visible++;
  });
  $('#emptyTip').classList.toggle('hidden', visible>0);
}

/* ---------- 大图缩放 ---------- */
var lbz = {z:1, tx:0, ty:0};
var lbRot = 0;  /* 0/90/180/270,竖屏看横图时旋转填充 */
function applyZoom(){
  var img = $('#lbImg');
  var t = '';
  if(lbz.tx || lbz.ty) t += 'translate('+lbz.tx+'px,'+lbz.ty+'px) ';
  if(lbRot) t += 'rotate('+lbRot+'deg) ';
  if(lbz.z > 1) t += 'scale('+lbz.z+')';
  img.style.transform = t;
  /* 只有放大时才提升合成层,避免常驻大纹理拖累滚动 */
  img.style.willChange = lbz.z > 1 ? 'transform' : 'auto';
  $('#lbStage').classList.toggle('zoomed', lbz.z > 1);
  $('#lbZoomVal').textContent = Math.round(lbz.z*100) + '%';
}
function resetZoom(){ lbz = {z:1, tx:0, ty:0}; applyZoom(); }
function zoomAt(cx, cy, factor){
  var st = $('#lbStage'), r = st.getBoundingClientRect();
  var nz = Math.min(10, Math.max(1, lbz.z * factor));
  if(nz === lbz.z){
    if(nz === 1){ lbz.tx = 0; lbz.ty = 0; applyZoom(); }
    return;
  }
  var px = cx - (r.left + r.width/2), py = cy - (r.top + r.height/2);
  var k = nz / lbz.z;
  lbz.tx = px - (px - lbz.tx) * k;
  lbz.ty = py - (py - lbz.ty) * k;
  lbz.z = nz;
  applyZoom();
}
function zoomCenter(factor){
  var r = $('#lbStage').getBoundingClientRect();
  zoomAt(r.left + r.width/2, r.top + r.height/2, factor);
}

/* ---------- 灯箱 ---------- */
var LB = {list:[], idx:0, title:''};
function openLightbox(item, i, listOverride){
  var list = listOverride || origsOf(item);
  if(!list.length) return;
  LB = {item:item, list:list, idx:Math.min(i, list.length-1), title:'#'+item['编号']+' · '+str(item['品牌'])+' '+str(item['型号'])};
  lbRot = 0;
  resetZoom();
  $('#lightbox').classList.remove('hidden');
  /* 大图打开期间锁定背景页面滚动 */
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  showLb();
}
function showLb(){
  var img = $('#lbImg');
  var ld = $('#lbLoading');
  var done = function(){ fitStage(); img.style.visibility=''; if(ld) ld.classList.add('hidden'); };
  img.onload = done;
  img.onerror = done;
  /* 立即丢弃旧帧:先隐藏旧图再换地址,不用等新图加载完才切换 */
  img.style.visibility='hidden';
  if(ld) ld.classList.remove('hidden');
  img.src = LB.list[LB.idx];
  if(img.complete && img.naturalWidth) done();
  $('#lbCap').textContent = LB.title+'　·　'+(LB.idx+1)+' / '+LB.list.length;
  var fac = [];
  ['原厂壳体','原厂键帽'].forEach(function(k){
    var v = str(LB.item[k]).trim();
    if(v) fac.push(k+':'+v);
  });
  var sub = document.getElementById('lbCapSub');
  sub.textContent = fac.join('　+　');
  sub.style.display = fac.length ? '' : 'none';
  var multi = LB.list.length>1;
  $('#lbPrev').style.display = multi?'':'none';
  $('#lbNext').style.display = multi?'':'none';
}
function navLb(d){
  if(LB.list.length<2) return;
  LB.idx = (LB.idx + d + LB.list.length) % LB.list.length;
  resetZoom();
  showLb();
}
function closeLb(){
  $('#lightbox').classList.add('hidden');
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
  var img = $('#lbImg');
  /* 换成 1px 占位图,立即释放已解码的大位图,避免后续滚动卡顿 */
  img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  img.style.transform = '';
  img.style.willChange = 'auto';
  img.style.visibility = '';
  var ld = $('#lbLoading');
  if(ld) ld.classList.add('hidden');
  resetZoom();
}

/* 显示区域比例与图片一致:按原图长宽比在可视范围内等比取最大 */
function fitStage(){
  var img = $('#lbImg'), st = $('#lbStage');
  var iw = img.naturalWidth, ih = img.naturalHeight;
  if(!iw || !ih) return;
  var availW = window.innerWidth * 0.98;
  var availH = window.innerHeight * 0.92;
  var kw, kh;
  if(lbRot % 180){
    kw = availW / ih; kh = availH / iw;
  }else{
    kw = availW / iw; kh = availH / ih;
  }
  var k = Math.min(kw, kh);
  img.style.width = Math.round(iw * k) + 'px';
  img.style.height = Math.round(ih * k) + 'px';
  img.style.maxWidth = 'none';
  img.style.maxHeight = 'none';
  if(lbRot % 180){
    st.style.width = Math.round(ih * k) + 'px';
    st.style.height = Math.round(iw * k) + 'px';
  }else{
    st.style.width = Math.round(iw * k) + 'px';
    st.style.height = Math.round(ih * k) + 'px';
  }
  applyZoom();
}
window.addEventListener('resize', function(){
  if(!$('#lightbox').classList.contains('hidden')) fitStage();
});

  });
  /* 大图缩放:滚轮/双指缩放,放大后拖动平移,双击放大或还原 */
  $('#lbStage').addEventListener('wheel', function(e){
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1/1.12);
  }, {passive:false});
  var pts = new Map(), drag = null, pinch = null;
  var stage = $('#lbStage');
  stage.addEventListener('pointerdown', function(e){
    if(e.button !== 0) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    stage.setPointerCapture(e.pointerId);
    if(pts.size === 2){
      var a = Array.from(pts.values());
      pinch = {d: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y)};
      drag = null;
    }else if(lbz.z > 1){
      drag = {x:e.clientX, y:e.clientY, tx:lbz.tx, ty:lbz.ty};
      stage.classList.add('dragging');
    }
  });
  stage.addEventListener('pointermove', function(e){
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pts.size === 2){
      var a = Array.from(pts.values());
      var d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
      if(Math.abs(d - pinch.d) > 1){
        zoomAt((a[0].x+a[1].x)/2, (a[0].y+a[1].y)/2, d/pinch.d);
        pinch.d = d;
      }
    }else if(drag && lbz.z > 1){
      lbz.tx = drag.tx + (e.clientX - drag.x);
      lbz.ty = drag.ty + (e.clientY - drag.y);
      applyZoom();
    }
  });
  function endPt(e){
    pts.delete(e.pointerId);
    if(pts.size < 2) pinch = null;
    if(pts.size === 0){ drag = null; stage.classList.remove('dragging'); }
  }
  stage.addEventListener('pointerup', endPt);
  stage.addEventListener('pointercancel', endPt);
  stage.addEventListener('dblclick', function(e){
    if(lbz.z > 1) resetZoom();
    else zoomAt(e.clientX, e.clientY, 2.5);

    clearTimeout(tuckTimer);
    if(on) armTuck();

  /* 手机端:累计滑动超过 20px 才切换顶部栏(下滑收起,上滑出现);页面顶部 240px 内常显 */
  var lastY = window.scrollY;

    if(searchOpen) closeSearch();
    wakeTopBtn();
    var bar = document.querySelector('.toolbar');
    if(!window.matchMedia('(max-width:680px)').matches){
      bar.classList.remove('tb-hidden');
      lastY = window.scrollY;
      return;
    }
    /* 手机端:下滑收起,上滑唤出 */
    var y = window.scrollY, dy = y - lastY;
    if(y < 240){ bar.classList.remove('tb-hidden'); lastY = y; return; }
    if(dy > 20){ bar.classList.add('tb-hidden'); lastY = y; }
    else if(dy < -20){ bar.classList.remove('tb-hidden'); lastY = y; }
  }, {passive:true});
  document.addEventListener('keydown', function(e){
    var lbOpen = !$('#lightbox').classList.contains('hidden');
    if(e.key==='Escape'){
      if(navOpen){ closeNav(); return; }
      if(!$('#payModal').classList.contains('hidden')){ hidePay(); return; }

    }else if(lbOpen && e.key==='ArrowLeft'){ navLb(-1); }
    else if(lbOpen && e.key==='ArrowRight'){ navLb(1); }
  });
}
